_member: &memberConfig
  date: &ANALYSIS_DATE '@ANALYSIS_DATE@'
  state variables:
  - water_vapor_mixing_ratio_wrt_moist_air
  - air_pressure_at_surface
  - air_temperature
  - northward_wind
  - eastward_wind
  - air_potential_temperature
  - dry_air_density
  - u
  - water_vapor_mixing_ratio_wrt_dry_air
  - air_pressure
  - landmask
  - seaice_fraction
  - snowc
  - skin_temperature_at_surface
  - ivgtyp
  - isltyp
  - snowh
  - vegetation_area_fraction
  - air_temperature_at_2m
  - water_vapor_mixing_ratio_wrt_moist_air_at_2m
  - eastward_wind_at_10m
  - northward_wind_at_10m
  - lai
  - smois
  - tslb
  - pressure_p
  - cloud_liquid_water
  - cloud_liquid_ice
  - graupel
  - rain_water
  - snow_water
  - cldfrac
  - equivalent_reflectivity_factor
  - w
  - upward_air_velocity
  stream name: background

increment variables: [water_vapor_mixing_ratio_wrt_moist_air, air_pressure_at_surface, air_temperature, northward_wind, eastward_wind]

output mean prior:
  filename: ./prior_mean.nc
  stream name: background

output:
  filename: ./data/ens/mem%{member}%.nc
  stream name: analysis

time window:
  begin: '@BEGIN_DATE@'
  length: PT4H

geometry:
  nml_file: ./namelist.atmosphere
  streams_file: ./streams.atmosphere
  deallocate non-da fields: true
  interpolation type: unstructured
  iterator dimension: 3
  update 2mTQ between outer loops: true

background:
  members from template:
    template:
      <<: *memberConfig
      filename: ./data/ens/mem%iMember%.nc
    pattern: "%iMember%"
    start: 1
    zero padding: 3
    nmembers: '@ENS_SIZE@'

driver:
  update obs config with geometry info: true
  do test prints: false
  do posterior observer: true
  save posterior mean: true
  save posterior ensemble: true
  save prior mean: true
  use control member: false

local ensemble DA:
  solver: Deterministic LETKF
  use linear observer: true
  inflation:
    rtps: 0.95

_conventional vertical localization: &HeightVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: 3500
  ioda vertical coordinate: height
  ioda vertical coordinate group: MetaData
  localization function: Gaspari Cohn

_conventional vertical localization: &SfcVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: 4000
  ioda vertical coordinate: height
  ioda vertical coordinate group: MetaData
  localization function: Gaspari Cohn

_sfc_wind_vertical_localization: &SfcWindVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: 1000
  ioda vertical coordinate: stationElevation
  ioda vertical coordinate group: MetaData
  localization function: Gaspari Cohn

_refl10m vertical localization: &Refl10mVertObsLoc
  localization method: Vertical localization
  vertical lengthscale: 3500
  ioda vertical coordinate: height
  ioda vertical coordinate group: MetaData
  localization function: Gaspari Cohn

observations:
     observers:
